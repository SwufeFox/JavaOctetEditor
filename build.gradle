import java.nio.file.Files
import java.text.SimpleDateFormat
import java.time.Duration

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'idea'
}

group 'cn.enaium'
version project.version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

jar {
    archiveClassifier.set('plain')
    manifest.attributes(
            'Manifest-Version': 1.0,
            'Main-Class': 'cn.enaium.joe.Main',
            "Implementation-Title": "${project.name}",
            "Implementation-Version": "${project.version}",
            "Implementation-Vendor": "${project.group}",
            "Implementation-Timestamp": new SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(new Date()),
            "Premain-Class": "cn.enaium.joe.Agent",
            "Agent-Class": "cn.enaium.joe.Agent",
            "Can-Redefine-Classes": true,
            "Can-Retransform-Classes": true
    )
}


repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.quiltmc.org/repository/release' }
    maven { url 'https://maven.cleanroommc.com'}
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'

    implementation 'com.formdev:flatlaf:3.5.2'
    implementation 'com.formdev:flatlaf-extras:3.5.2'
    implementation 'com.github.weisj:jsvg:1.6.1'
    //noinspection GradlePackageUpdate
    implementation 'com.miglayout:miglayout-swing:11.4.2'
    implementation 'com.github.bobbylight:RSyntaxTextArea:3.5.2'
    implementation 'org.ow2.asm:asm-tree:9.8'
    implementation 'org.ow2.asm:asm-util:9.8'
    implementation 'org.ow2.asm:asm-commons:9.8'
    implementation 'org.benf:cfr:0.152'
    implementation 'com.github.mstrobel.procyon:procyon-decompiler:v0.6.0'
    implementation 'org.vineflower:vineflower:1.11.1'
    implementation 'org.javassist:javassist:3.30.2-GA'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.tinylog:tinylog-api:2.7.0'
    implementation 'org.tinylog:tinylog-impl:2.7.0'
    implementation 'net.fabricmc:mapping-io:0.7.1'
    implementation 'zone.rong:imaginebreaker:2.1'
    implementation 'com.fifesoft:languagesupport:3.4.0'
    implementation 'com.fifesoft:autocomplete:3.3.2'
}

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

shadowJar {
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    archiveClassifier.set('')
}

build.dependsOn shadowJar

tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Launch the desktop editor with the full runtime classpath'
    mainClass = 'cn.enaium.joe.Main'
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = layout.projectDirectory.dir('run').asFile
    doFirst {
        workingDir.mkdirs()
    }
}

tasks.register('desktopSmoke', JavaExec) {
    group = 'verification'
    description = 'Exercise desktop editing and export against the packaged JAR in a graphical session'
    dependsOn tasks.named('smokeClasses'), tasks.named('shadowJar')
    mainClass = 'cn.enaium.joe.smoke.DesktopSmoke'
    classpath = sourceSets.smoke.output + files(tasks.named('shadowJar').flatMap { it.archiveFile })
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    timeout = Duration.ofMinutes(3)
    doFirst {
        def smokeRoot = layout.buildDirectory.dir('desktop-smoke').get().asFile
        smokeRoot.mkdirs()
        def smokeRunDirectory = Files.createTempDirectory(smokeRoot.toPath(), 'run-').toFile()
        workingDir = smokeRunDirectory
        setArgs([smokeRunDirectory.absolutePath])
        logger.lifecycle("Desktop smoke evidence: ${smokeRunDirectory}")
    }
}