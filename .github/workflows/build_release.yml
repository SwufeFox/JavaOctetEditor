# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# Build the runnable shaded JAR and publish it as a GitHub release attachment.

name: Build and Release JAR

on: 
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest

    steps:
          - name: Checkout Repository
            uses: actions/checkout@v4.1.4
          - name: Grant Execute Permission for gradlew
            run: chmod +x ./gradlew
          - name: Set up JDK 21
            uses: actions/setup-java@v4.2.1
            with:
              java-version: '21'
              distribution: 'temurin'

          - name: Build
            run: ./gradlew build
          - name: Select Runnable JAR
            id: artifact
            shell: bash
            run: |
              for artifact in build/libs/*.jar; do
                case "$artifact" in *-plain.jar) continue ;; esac
                test -f "$artifact" || exit 1
                echo "path=$artifact" >> "$GITHUB_OUTPUT"
                version=${artifact#build/libs/JavaOctetEditor-}
                echo "tag=v${version%.jar}" >> "$GITHUB_OUTPUT"
              done
          - name: Create GitHub Release
            uses: ncipollo/release-action@v1.14.0
            with:
              artifacts: "${{ steps.artifact.outputs.path }}"
              tag: "${{ steps.artifact.outputs.tag }}"
              generateReleaseNotes: true
